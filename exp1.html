<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Reg Form</title>
</head>
<body>

    <h4> This is a form reg </h4>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="name">
        <br><br>
        <label for="dob">Dob</label>
        <input type="date" id="dob" name="dob" placeholder="dob">
        <br><br>
        <label for="eid">email</label>
        <input type="email" id="eid" name="eid" placeholder="eid">
        <br><br>
        <label for="age">age</label>
        <input type="number" id="age" name="age" placeholder="21">
        <br><br>
        <label for="pass">password</label>
        <input type="password" id="pass" name="pass" placeholder="123#$%">
        <br><br>
        <input type="submit" name="submit" value="submit">


    </form>
    
</body>
</html>
